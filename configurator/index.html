<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Chesapeake Configurator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <img src="chesapeake.png" alt="Chesapeake Logo" class="logo">
            <span class="title">CHESAPEAKE CONFIGURATOR</span>
        </div>
        <div class="connection-controls">
            <button id="btn-connect" class="btn">Connect</button>
            <span id="connection-status" class="status-indicator disconnected">Disconnected</span>
            <button id="btn-reboot" class="btn" disabled>Reboot</button>
            <button id="btn-defaults" class="btn btn-warning" disabled>Reset Defaults</button>
            <button id="btn-calibrate" class="btn btn-success" disabled>Calibrate</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="panel console-panel">
            <h2>Serial Monitor & CLI</h2>
            <div class="cli-container">
                <div class="monitor-header">Serial Monitor</div>
                <div id="serial-monitor" class="serial-monitor"></div>
                <div class="monitor-header">CLI Terminal</div>
                <div id="cli-output" class="cli-output"></div>
                <div class="cli-input-line">
                    <input type="text" id="cli-input" placeholder="Type command (e.g. help, dump) and press Enter..." disabled>
                    <button id="btn-send-cli" class="btn" disabled>Send</button>
                </div>
            </div>
        </div>

        <div class="panel test-panel">
            <h2>Actuator Test</h2>
            <div class="test-controls" style="display: flex; flex-direction: column; gap: 15px; flex: 1;">
                <div class="test-enable-row" style="display: flex; align-items: center; gap: 10px;">
                    <button id="btn-toggle-test" class="btn btn-warning" disabled>Enable Test Mode</button>
                    <span id="test-status" class="status-indicator disconnected">Test Disabled</span>
                </div>
                <div id="test-placeholder" class="params-placeholder">
                    Connect and enable test mode to control actuators.
                </div>
                <div id="test-sliders" class="test-sliders-container" style="display: none; flex-direction: column; gap: 12px; overflow-y: auto; flex: 1;">
                    <!-- Dynamically populated sliders -->
                </div>
            </div>
        </div>

        <div class="panel params-panel">
            <div class="panel-header">
                <h2>Parameters</h2>
                <div class="param-actions">
                    <input type="text" id="param-search" placeholder="Search..." disabled>
                    <button id="btn-refresh" class="btn" disabled>Reload</button>
                    <button id="btn-save" class="btn btn-success" disabled>Save Changes</button>
                </div>
            </div>
            <div class="params-container">
                <div id="params-loading" class="params-placeholder">
                    Connect to view and edit flight parameters.
                </div>
                <div id="params-grid" class="params-grid" style="display: none;"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
