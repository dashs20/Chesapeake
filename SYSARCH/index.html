            width: 100%;
            height: 100%;
        }
        
        .sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            z-index: 10;
        }

            font-size: 24px;
            font-weight: 800;

            margin-bottom: 24px;
            display: flex;
            align-items: center;
        }
        
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 800;
            color: #f8fafc;
        }
        
        .stat-label {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }
        
        .details-panel {
            flex-grow: 1;

            margin-top: 12px;
            padding-right: 4px;
        }
        
        .details-empty {
            color: #64748b;

            background: rgba(255, 255, 255, 0.03);

            padding: 16px;
        }

            font-size: 18px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 8px;
            word-break: break-all;
        }
        
        .details-row {
            margin-bottom: 8px;
            font-size: 13px;
        }
        
        .details-label {
            color: #94a3b8;
            font-weight: 600;
        }
        
        .canvas-area {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }
        
        #network {
            width: 100%;
            height: 100%;
        }
        
        .controls {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        
        button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        button:hover {
            background: #0ea5e9;
            border-color: #38bdf8;
        }
        
        .legend {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        "arrows": "to"
    },
    {
        "from": 32,
        "to": 33,
        "arrows": "to"
    },
    {
        "from": 33,
        "to": 19,
        "arrows": "to"
    },
    {
        "from": 33,
        "to": 1,
        "arrows": "to"
    },
    {
        "from": 34,
        "to": 35,
        "arrows": "to"
    },
    {
        "from": 35,
        "to": 36,
        "arrows": "to"
    },
    {
        "from": 36,
        "to": 19,
        "arrows": "to"
    },
    {
        "from": 36,
        "to": 2,
        "arrows": "to"
    },
    {
        "from": 37,
        "to": 38,
        "arrows": "to"
    },
    {
        "from": 37,
        "to": 35,
        "arrows": "to"
    },
    {
        "from": 38,
        "to": 36,
        "arrows": "to"
    }
];
        
        const groupColors = {
            "GNC": { border: "#0284c7", background: "#0ea5e9", highlight: { border: "#38bdf8", background: "#7dd3fc" } },
            "HAL": { border: "#059669", background: "#10b981", highlight: { border: "#34d399", background: "#6ee7b7" } },
            "PARAMS": { border: "#d97706", background: "#f59e0b", highlight: { border: "#fbbf24", background: "#fde047" } },
            "MAIN": { border: "#7c3aed", background: "#8b5cf6", highlight: { border: "#a78bfa", background: "#c4b5fd" } }
        };
        
        const nodes = rawNodes.map(n => {
            const color = groupColors[n.group] || groupColors["MAIN"];
            return {
                id: n.id,
                label: n.label,
                title: n.title,
                value: n.value,
                color: color,
                font: { color: "#f8fafc", face: "Outfit" },
                scaling: { min: 12, max: 30 },
                borderWidth: 2,
                shape: "dot",
                rel_path: n.rel_path,
                line_count: n.line_count,
                groupName: n.group
            };
        });

        const edges = rawEdges.map(e => ({
            from: e.from,
            to: e.to,
            arrows: "to",
            color: { color: "rgba(255,255,255,0.15)", highlight: "#38bdf8" },
            width: 1,
            hoverWidth: 2,
            selectionWidth: 2
        }));

        const container = document.getElementById("network");
        const data = {
            nodes: new vis.DataSet(nodes),
            edges: new vis.DataSet(edges)
        };
        
        let hierarchical = false;
        let physicsEnabled = true;

        const options = {
            nodes: {
                shape: "dot"
            },
            edges: {
                smooth: {
                    type: "continuous",
                    forceDirection: "none",
                    roundness: 0.5
                }
            },
            groups: groupColors,
            physics: {
                stabilization: {
                    iterations: 150
                },
                barnesHut: {
                    gravitationalConstant: -8000,
                    springConstant: 0.04,
                    springLength: 95
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            }
        };

        let network = new vis.Network(container, data, options);
        
        network.on("click", function (params) {
            const inspector = document.getElementById("inspector");
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const nodeData = nodes.find(n => n.id === nodeId);
                
                const dependents = edges
                    .filter(e => e.to === nodeId)
                    .map(e => nodes.find(n => n.id === e.from).label);
                
                const dependencies = edges
                    .filter(e => e.from === nodeId)
                    .map(e => nodes.find(n => n.id === e.to).label);
                
                let dependentsHtml = dependents.length > 0 
                    ? dependents.map(d => `<div style="background:rgba(255,255,255,0.05); padding:4px 8px; margin-bottom:4px; border-radius:4px;">${d}</div>`).join("")
                    : '<div style="color:#64748b; font-style:italic;">None</div>';
                    
                let dependenciesHtml = dependencies.length > 0 
                    ? dependencies.map(d => `<div style="background:rgba(255,255,255,0.05); padding:4px 8px; margin-bottom:4px; border-radius:4px;">${d}</div>`).join("")
                    : '<div style="color:#64748b; font-style:italic;">None</div>';

                inspector.innerHTML = `
                    <div class="details-card">
                        <div class="details-title">${nodeData.label}</div>
                        <div class="details-row">
                            <span class="details-label">Module:</span> ${nodeData.groupName}
                        </div>
                        <div class="details-row">
                            <span class="details-label">Path:</span> <span style="font-family:monospace; color:#cbd5e1; font-size:12px;">src/${nodeData.rel_path}</span>
                        </div>
                        <div class="details-row">
                            <span class="details-label">Lines of Code:</span> ${nodeData.line_count}
                        </div>
                        
                        <div class="section-title" style="margin-top:16px; margin-bottom:8px; font-size:12px;">Includes</div>
                        ${dependenciesHtml}
                        
                        <div class="section-title" style="margin-top:16px; margin-bottom:8px; font-size:12px;">Included By</div>
                        ${dependentsHtml}
                    </div>
                `;
            } else {
                inspector.innerHTML = '<div class="details-empty">Click on any node in the system diagram to inspect details.</div>';
            }
        });

        function toggleLayout() {
            hierarchical = !hierarchical;
            if (hierarchical) {
                network.setOptions({
                    layout: {
                        hierarchical: {
                            direction: "UD",
                            sortMethod: "directed",
                            nodeSpacing: 150,
                            levelCalculationMethod: "hubsize"
                        }
                    },
                    physics: false
                });
            } else {
                network.setOptions({
                    layout: {
                        hierarchical: false
                    },
                    physics: {
                        enabled: physicsEnabled
                    }
                });
            }
        }

        function fitNetwork() {
            network.fit({ animation: true });
        }

        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            const btn = document.querySelector("button[onclick='togglePhysics()']");
            btn.textContent = physicsEnabled ? "Pause Physics" : "Resume Physics";
            network.setOptions({
                physics: {
                    enabled: physicsEnabled
                }
            });
        }
    </script>
</body>
